name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generated Sanity types are committed, so CI needs no Sanity auth.
  check:
    uses: ZivFuchs/site-kit/.github/workflows/site-ci.yml@main
    secrets: inherit
    with:
      analyze: true
      env: '{"PUBLIC_SANITY_PROJECT_ID": "${{ vars.PUBLIC_SANITY_PROJECT_ID }}", "PUBLIC_SANITY_DATASET": "${{ vars.PUBLIC_SANITY_DATASET }}"}'
      run: |
        pnpm --filter site cf-types
        pnpm lint
        pnpm typecheck
        pnpm build
